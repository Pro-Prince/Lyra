<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lyra Companion</title>
    <meta name="description" content="Your 3D AI Companion." />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#160F17" />
    
    <!-- Preload primary 3D model for immediate availability -->
    <link rel="preload" href="/models/lyra.vrm" as="fetch" crossorigin="anonymous" />
    
    <meta property="og:title" content="Lyra Companion" />
    <meta property="og:description" content="Your 3D AI Companion." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var str = String(arguments[i]);
            if (
              str.indexOf('[vite] failed to connect to websocket') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1 ||
              str.indexOf('WebSocket connection to') !== -1 ||
              (str.indexOf('failed to connect') !== -1 && str.indexOf('websocket') !== -1)
            ) {
              return;
            }
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var str = String(arguments[i]);
            if (
              str.indexOf('THREE.Clock') !== -1 ||
              str.indexOf('Clock:') !== -1 ||
              str.indexOf('THREE.Timer') !== -1 ||
              str.indexOf('removeUnnecessaryJoints') !== -1 ||
              str.indexOf('combineSkeletons') !== -1
            ) {
              return;
            }
          }
          return origWarn.apply(console, arguments);
        };

        function isWsError(err) {
          if (!err) return false;
          var str = String((err && err.message) || err);
          return str.toLowerCase().includes('websocket') || str.toLowerCase().includes('ws');
        }
        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (isWsError(e.error) || isWsError(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
